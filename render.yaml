services:
  - type: web
    name: paradox
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: PARADOX_DATA_DIR
        value: /tmp/paradox-data
